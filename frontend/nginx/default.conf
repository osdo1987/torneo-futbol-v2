server {
    listen 80;
    server_name torneos.osdosoft.com localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Stream SSE: sin buffering y con read timeout largo para conexiones de larga duración
    location ~ ^/api/partidos/[0-9]+/stream$ {
        proxy_pass http://torneo_api_prod:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Serve uploaded static files from the API container
    location /static/ {
        proxy_pass http://torneo_api_prod:5000;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /apidocs {
        proxy_pass http://torneo_api_prod:5000/apidocs;
        proxy_set_header Host $host;
    }

    location /flasgger_static {
        proxy_pass http://torneo_api_prod:5000/flasgger_static;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}