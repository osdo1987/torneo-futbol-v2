version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: torneo_api_prod
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 --worker-class gthread --workers 4 --threads 16 --timeout 120 --graceful-timeout 30 --worker-tmp-dir /dev/shm run:app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
      SEED_DEMO: ${SEED_DEMO:-0}
    networks:
      - torneo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: torneo_frontend_prod
    restart: always
    # El Nginx gateway se conecta a este contenedor por la red interna, sin puertos al host
    volumes:
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - torneo_network
      - osdosoft_public

networks:
  torneo_network:
    driver: bridge
  osdosoft_public:
    external: true