services:
  db:
    image: postgres:15
    container_name: torneo_futbol_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-torneo_futbol}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  api:
    build: .
    container_name: torneo_futbol_api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-torneo_futbol}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key}
      FLASK_ENV: development
    volumes:
      - .:/app
    ports:
      - "5010:5000"
    depends_on:
      - db

volumes:
  postgres_data: